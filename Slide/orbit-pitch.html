  <style>

    .overview{position:fixed;z-index:30;inset:0;display:none;overflow:auto;padding:28px;background:#060d1c}.overview.open{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.overview button{min-height:120px;padding:18px;text-align:left;color:#dce5fa;border:1px solid rgba(255,255,255,.12);border-radius:15px;background:#101b34;cursor:pointer}.overview button:hover{border-color:var(--cyan);transform:translateY(-2px)}.overview b{display:block;margin-bottom:8px;color:var(--cyan)}.overview span{font-size:13px;line-height:1.35}

  <script>
    const allSlides=[
      {chapter:'Mở đầu',kicker:'Đề tài P-132 · Orbit AI Assistant',title:'Xây dựng trợ lý AI cá nhân thông minh, chủ động và đáng tin cậy.',tone:'dark',body:`<div class="split cover-layout"><div class="cover-copy"><h1>Xây dựng trợ lý AI cá nhân <span class="gradient">thông minh, chủ động và đáng tin cậy.</span></h1><p class="lead">Orbit Personal Agent ứng dụng LLM và kiến trúc agentic để thấu hiểu nhu cầu, tổ chức công việc, ghi nhớ điều quan trọng và hỗ trợ người dùng đúng lúc — minh bạch, an toàn và luôn dưới quyền quyết định của họ.</p><div class="chip-row"><span class="chip">LLM-powered</span><span class="chip">Agentic workflow</span><span class="chip">Human-in-the-loop</span><span class="chip">Privacy & consent</span></div></div><div class="orbit"><div class="ring"></div><div class="ring r2"></div><div class="planet"></div><div class="sat s1">Hiểu</div><div class="sat s2">Nhớ</div><div class="sat s3">Làm</div><div class="sat s4">Tin cậy</div></div></div>`,sources:['README.md','src/agents/graph.py','src/agents/tools/__init__.py']},
      {chapter:'Mở đầu',kicker:'Bối cảnh đề tài',title:'Người dùng không thiếu dữ liệu — họ thiếu một lớp hiểu và hành động thống nhất.',tone:'blue',body:`<div class="split wide-left"><div><h2>Thông tin cá nhân nằm rải rác; <span class="gradient">hành động vẫn phải nối thủ công.</span></h2><p class="lead">Một quyết định có thể xuất hiện trong chat, deadline nằm trong task, cuộc họp ở Calendar và cách làm việc nằm trong memory. Đề tài giải quyết khoảng trống giữa “biết thông tin” và “thực hiện bước tiếp theo”.</p></div><div class="stack"><div class="row"><b>01</b><p><strong>Phân mảnh:</strong> người dùng phải tự tìm và ghép nhiều nguồn ngữ cảnh.</p></div><div class="row"><b>02</b><p><strong>Ma sát:</strong> cam kết trong hội thoại chưa tự trở thành task, lịch hoặc reminder.</p></div><div class="row"><b>03</b><p><strong>Niềm tin:</strong> AI chỉ hữu ích khi quyền đọc dữ liệu và quyền hành động được kiểm soát.</p></div></div></div>`,sources:['README.md','Frontend/user/src/pages/PersonalAssistantPage.jsx','src/api/routes.py']},
      {chapter:'Mở đầu',kicker:'Một câu',title:'Orbit giúp người dùng nhớ đúng việc, hiểu đúng ngữ cảnh và hành động đúng lúc.',body:`<div class="quote">Orbit giúp người dùng <span class="accent">nhớ đúng việc</span>, hiểu đúng ngữ cảnh và hành động đúng lúc — mà không tự ý thay người dùng quyết định.</div><div class="chip-row"><span class="chip">Ask</span><span class="chip">Understand</span><span class="chip">Propose</span><span class="chip">Confirm</span><span class="chip">Execute</span></div>`,sources:['src/agents/nodes/planner_node.py','src/agents/tools/calendar_tool.py','src/agents/tools/reminder_tool.py']},
      {chapter:'Mở đầu',kicker:'Mục tiêu đề tài',title:'Xây dựng một agent biết hiểu, ghi nhớ, lập kế hoạch và sử dụng công cụ — nhưng không vượt quyền.',body:`<div class="grid four"><div class="card"><div class="icon">01</div><h3>Hiểu ngữ cảnh</h3><p>Tóm tắt hội thoại, tìm thông tin và phát hiện cam kết từ dữ liệu được cấp quyền.</p></div><div class="card"><div class="icon">02</div><h3>Tổ chức công việc</h3><p>Trích xuất task, ưu tiên deadline và hợp nhất dữ liệu thành timeline cá nhân.</p></div><div class="card"><div class="icon">03</div><h3>Hành động có kiểm soát</h3><p>Tạo draft lịch hoặc reminder, dừng bằng interrupt và chỉ thực thi sau xác nhận.</p></div><div class="card"><div class="icon">04</div><h3>Duy trì niềm tin</h3><p>Áp dụng owner filter, consent, guardrail, provenance và trạng thái bền vững.</p></div></div>`,sources:['src/agents/graph.py','src/agents/tools/__init__.py','src/services/consent_service.py','src/services/guardrail_service.py']},
      {chapter:'Mở đầu',kicker:'Đóng góp hiện thực hóa',title:'Đề tài đã hình thành một nền tảng agentic end-to-end có thể trình diễn và kiểm chứng.',body:`<div class="grid four"><div class="metric"><strong>14</strong><span>tool nghiệp vụ cho chat, task, Calendar, reminder và context</span></div><div class="metric"><strong>3</strong><span>nhà cung cấp LLM có thể cấu hình qua một model factory</span></div><div class="metric"><strong>HITL</strong><span>interrupt/resume kiểm soát side effect trước thực thi</span></div><div class="metric"><strong>435</strong><span>test backend passed trong lần chạy xác nhận</span></div></div><div class="callout good" style="margin-top:1.4vw">Giao diện, API, LangGraph, tool execution, PostgreSQL persistence, scheduler và realtime đã được nối thành luồng chạy thật — tạo nền tảng rõ ràng cho demo và tiếp tục hardening.</div>`,sources:['src/agents/tools/__init__.py','src/services/llm.py','src/agents/graph.py','pytest -q · executed 2026-08-24']},
      {chapter:'01 · Bài toán',kicker:'Tín hiệu bị chôn vùi',title:'Công việc quan trọng đang nằm rải rác trong quá nhiều bề mặt.',tone:'dark',body:`<div class="split"><div><h2>Công việc quan trọng đang nằm rải rác trong <span class="gradient">quá nhiều bề mặt.</span></h2><p class="lead">Deadline có thể ở chat, cuộc họp nằm trong Calendar, còn cách làm việc lại nằm trong trí nhớ của chính người dùng.</p></div><div class="stack"><div class="row"><b>↗</b><p>Chat chứa quyết định nhưng không tự thành task.</p></div><div class="row"><b>◫</b><p>Lịch cho biết thời gian nhưng không hiểu ưu tiên.</p></div><div class="row"><b>✦</b><p>Memory giúp cá nhân hóa nhưng cần được quản trị đúng.</p></div></div></div><div class="section-index">01</div>`,sources:['README.md']},
      {chapter:'01 · Bài toán',kicker:'Một ngày phân mảnh',title:'Người dùng phải tự làm công việc “kết nối dữ liệu”.',body:`<div class="pipeline"><div class="pipe"><b>08:30 · Chat</b><span>“Chiều nay gửi bản review nhé.”</span><em>Tín hiệu</em></div><div class="pipe"><b>09:15 · Task</b><span>Tự nhớ để nhập lại thành đầu việc.</span><em>Thao tác tay</em></div><div class="pipe"><b>11:00 · Calendar</b><span>Kiểm tra xem lịch chiều có trống không.</span><em>Đối chiếu</em></div><div class="pipe"><b>14:00 · Memory</b><span>Cố nhớ người nhận thích báo cáo dạng nào.</span><em>Ngữ cảnh</em></div><div class="pipe"><b>17:30 · Rủi ro</b><span>Một cam kết vẫn chưa được ghi nhận.</span><em>Miss</em></div></div>`,sources:['Frontend/user/src/components/ai/AssistantContextPanel.jsx','src/services/timeline_service.py']},
      {chapter:'01 · Bài toán',kicker:'Chi phí thực',title:'Bỏ lỡ không chỉ là quên — đó là mất niềm tin.',body:`<div class="grid three"><div class="card"><div class="icon">1</div><h3>Chi phí chú ý</h3><p>Đọc lại, tìm kiếm và đối chiếu nhiều nguồn.</p></div><div class="card"><div class="icon">2</div><h3>Chi phí phối hợp</h3><p>Cam kết thiếu owner, hạn hoặc nguồn.</p></div><div class="card"><div class="icon">3</div><h3>Chi phí tin cậy</h3><p>Một trợ lý tự ý hành động gây hại hơn giá trị nó tạo ra.</p></div></div><div class="callout" style="margin-top:1.3vw">Bài toán đúng không phải “trả lời hay hơn”, mà là “chuyển ngữ cảnh thành bước tiếp theo có thể kiểm soát”.</div>`,sources:['src/services/proactive_service.py','src/agents/tools/calendar_tool.py']},

      {chapter:'01 · Bài toán',kicker:'Nguyên tắc',title:'Giá trị phải đi cùng quyền kiểm soát.',tone:'mint',body:`<div class="grid four"><div class="card"><h3>Private by default</h3><p>Dữ liệu lọc theo người dùng đã xác thực.</p></div><div class="card"><h3>Consent before context</h3><p>Chỉ nội dung được phép mới tới mô hình.</p></div><div class="card"><h3>Propose before execute</h3><p>Side effect phải dừng để xác nhận.</p></div><div class="card"><h3>Evidence over claims</h3><p>Tuyên bố phải truy được về code hoặc test.</p></div></div>`,sources:['src/services/consent_service.py','src/api/routes.py','src/agents/tools/reminder_tool.py']},

      {chapter:'02 · Sản phẩm',kicker:'Minh bạch nguồn',title:'UI có thể nói chính xác đã dùng bao nhiêu tin nhắn.',body:`<div class="split"><div><h2>UI có thể nói chính xác đã dùng <span class="accent">bao nhiêu tin nhắn.</span></h2><p class="lead">Response chứa counts, coverage, tác giả được đưa vào/loại ra, source IDs và consent snapshot.</p></div><div class="code">{\n  <span class="k">included_message_count</span>: 17,\n  <span class="k">window_message_count</span>: 20,\n  <span class="k">coverage</span>: <span class="v">0.85</span>,\n  <span class="k">source_message_ids</span>: [...],\n  <span class="k">consent_scope_hash</span>: <span class="g">"…"</span>\n}</div></div>`,sources:['src/models/schemas.py','src/services/consent_service.py','Frontend/user/src/components/chat/AIPanel.jsx']},
      {chapter:'02 · Sản phẩm',kicker:'Tóm tắt',title:'Tóm tắt là một tool chuyên biệt, không để planner tự ứng tác.',body:`<div class="split wide-left"><div><h2>Tóm tắt là tool chuyên biệt, không để planner <span class="accent">tự ứng tác.</span></h2><ul class="clean"><li>Ba style: brief, detailed, bullet points.</li><li>Luôn trả tiếng Việt.</li><li>Dữ liệu được bọc là untrusted.</li><li>Ngày tương đối neo theo múi giờ.</li><li>Không có lượt LLM relay thứ hai.</li></ul></div><div class="metric"><strong>1×</strong><span>không gọi planner lần hai chỉ để kể lại summary</span></div></div>`,sources:['src/agents/tools/summarize_tool.py','src/agents/graph.py','tests/test_agents/test_graph.py']},

      {chapter:'02 · Sản phẩm',kicker:'Proactive Agent',title:'Orbit có thể phát hiện cam kết ngay khi chat phát sinh.',tone:'dark',body:`<div class="split"><div><h2>Orbit có thể phát hiện cam kết <span class="gradient">ngay khi chat phát sinh.</span></h2><p class="lead">Luồng nền không chặn gửi message: lọc liên quan → phân tích cửa sổ → xác minh owner → tạo suggestion → realtime.</p></div><div class="stack"><div class="row"><b>30</b><p>Tối đa 30 message.</p></div><div class="row"><b>6h</b><p>Tuổi dữ liệu tối đa.</p></div><div class="row"><b>4k</b><p>Giới hạn ký tự phân tích.</p></div></div></div>`,sources:['src/services/proactive_service.py','src/services/chat_service.py']},
      {chapter:'02 · Sản phẩm',kicker:'Proactive reasoning',title:'Không phải cứ được nhắc tên là trở thành owner.',body:`<div class="grid three"><div class="card"><h3>Self</h3><p>Chính người đó tự cam kết.</p></div><div class="card"><h3>Confirmed</h3><p>Chính người đó xác nhận sau đề xuất.</p></div><div class="card"><h3>Invited</h3><p>Lời mời được gắn nhãn chưa xác nhận; chat nhiều người cần nêu tên.</p></div></div><div class="callout warn" style="margin-top:1.3vw">Người giao việc không tự động là owner; im lặng không phải đồng ý; cancellation có thể rút candidate cũ.</div>`,sources:['src/services/proactive_service.py']},

      {chapter:'04 · Kiến trúc',kicker:'System view',title:'Frontend → API → LangGraph → tools → dịch vụ dữ liệu.',tone:'dark',body:`<div class="pipeline"><div class="pipe"><b>React</b><span>Chat, tasks, calendar, reminders, memory</span><em>UI</em></div><div class="pipe"><b>FastAPI</b><span>JWT, validation, ownership, consent</span><em>API</em></div><div class="pipe"><b>LangGraph</b><span>Guardrail, planner, tools, compaction</span><em>Agent</em></div><div class="pipe"><b>Services</b><span>PostgreSQL, Google, scheduler, WebSocket</span><em>Runtime</em></div><div class="pipe"><b>LLM</b><span>Google, Groq hoặc OpenAI</span><em>Model</em></div></div><div class="section-index">04</div>`,sources:['src/main.py','src/agents/graph.py','src/services/llm.py','Frontend/user/package.json']},
      {chapter:'04 · Kiến trúc',kicker:'Request contract',title:'Client gửi ý định; server tự gắn identity và phạm vi tin cậy.',body:`<div class="split"><div class="code"><span class="c">// Client-controlled</span>\nmessage\nthread_id?\nconversation_id?\ncontext_limit\nscope?\n\n<span class="c">// Server-injected</span>\n<span class="g">user_id</span>\n<span class="g">personal data scope</span>\n<span class="g">authorized context</span>\n<span class="g">consent snapshot</span></div><div><h2>Model không tự chọn <span class="accent">mình đại diện cho ai.</span></h2><p class="lead">Identity từ JWT; conversation được kiểm tra participant; trợ lý riêng tự resolve data scope.</p></div></div>`,sources:['src/api/routes.py','src/models/schemas.py','src/auth/dependencies.py']},
      {chapter:'04 · Kiến trúc',kicker:'LangGraph',title:'Năm node tạo thành vòng đời một turn.',body:`<div class="flow"><div class="step"><small>01</small><h3>Input guardrail</h3><p>Block hoặc clarify.</p></div><div class="step"><small>02</small><h3>Planner</h3><p>Trả lời hoặc chọn tool.</p></div><div class="step"><small>03</small><h3>ToolNode</h3><p>Thực thi tool bind sẵn.</p></div><div class="step"><small>04</small><h3>Output guardrail</h3><p>Check plain response.</p></div><div class="step"><small>05</small><h3>Compaction</h3><p>Giới hạn growth.</p></div></div><div class="callout warn" style="margin-top:1.2vw">Summary/task extraction đi thẳng END để tránh LLM relay lần hai; đây là ngoại lệ có chủ đích.</div>`,sources:['src/agents/graph.py']},
      {chapter:'04 · Kiến trúc',kicker:'Planner',title:'LLM là bộ lập kế hoạch, không phải nguồn quyền.',body:`<div class="grid three"><div class="card"><h3>System prompt</h3><p>Domain, tool rules, tiếng Việt, ngày tương đối, untrusted data.</p></div><div class="card"><h3>Dynamic context</h3><p>Tối đa 5 people context và 5 memory.</p></div><div class="card"><h3>Tool binding</h3><p>Chỉ gọi danh sách tool server bind.</p></div></div><div class="callout" style="margin-top:1.3vw">Identity, consent và access được kiểm tra ngoài prompt; prompt không phải security boundary.</div>`,sources:['src/agents/nodes/planner_node.py','src/agents/tools/__init__.py']},
      {chapter:'04 · Kiến trúc',kicker:'Tool catalog',title:'14 tool của Personal Agent.',body:`<div class="grid four"><div class="card"><h3>Chat · 3</h3><p>summarize_conversation<br>extract_tasks<br>search_messages</p></div><div class="card"><h3>Calendar · 4</h3><p>create<br>list<br>update<br>delete event</p></div><div class="card"><h3>Reminder · 2</h3><p>create_reminder<br>list_reminders</p></div><div class="card"><h3>Context · 5</h3><p>tasks, memories, people, timeline, policy</p></div></div>`,sources:['src/agents/tools/__init__.py','src/agents/tools/registry.py']},
      {chapter:'04 · Kiến trúc',kicker:'Tool policy',title:'Đọc và ghi có mức rủi ro khác nhau.',body:`<table class="table"><thead><tr><th>Nhóm</th><th>Ví dụ</th><th>Confirmation</th><th>Kiểm soát</th></tr></thead><tbody><tr><td>Read-only</td><td>task, lịch, memory</td><td>Không</td><td>Owner + data scope</td></tr><tr><td>Analysis</td><td>summary, extract</td><td>Không</td><td>Authorized context + schema</td></tr><tr><td>State-changing</td><td>Calendar create/update/delete</td><td>Có</td><td>Policy → interrupt → recheck</td></tr><tr><td>Scheduling</td><td>create reminder</td><td>Có</td><td>Future time + persistent job</td></tr></tbody></table>`,sources:['src/agents/nodes/planner_node.py','src/agents/tools/calendar_tool.py','src/agents/tools/reminder_tool.py']},
      {chapter:'04 · Kiến trúc',kicker:'Human-in-the-loop',title:'Interrupt là trạng thái bền vững, không phải popup giả lập.',tone:'blue',body:`<div class="flow"><div class="step"><small>01</small><h3>Tool pauses</h3><p>Phát interrupt.</p></div><div class="step"><small>02</small><h3>API returns</h3><p>status interrupted.</p></div><div class="step"><small>03</small><h3>UI renders</h3><p>Draft + actions.</p></div><div class="step"><small>04</small><h3>Resume</h3><p>POST /chat/resume.</p></div><div class="step"><small>05</small><h3>Side effect</h3><p>Chạy khi approved.</p></div></div>`,sources:['src/api/routes.py','src/models/schemas.py','src/agents/tools/calendar_tool.py','tests/test_agents/test_graph.py']},
      {chapter:'04 · Kiến trúc',kicker:'Persistent thread',title:'Checkpoint Postgres giữ mạch hội thoại và interrupt qua restart.',body:`<div class="split"><div><h2>Checkpoint Postgres giữ mạch hội thoại và interrupt <span class="accent">qua restart.</span></h2><ul class="clean"><li>Internal ID ghép user và public thread ID.</li><li>Không dùng chung state giữa hai user.</li><li>Hết hạn xóa metadata và checkpoint.</li><li>Resume kiểm tra thread và owner.</li></ul></div><div class="metric"><strong>30d</strong><span>retention mặc định; cấu hình 1–365 ngày</span></div></div>`,sources:['src/agents/graph.py','src/services/thread_memory_service.py','src/config.py']},
      {chapter:'04 · Kiến trúc',kicker:'Compaction',title:'Thread dài được rút gọn deterministic để kiểm soát context growth.',body:`<div class="split"><div class="code">threshold  = <span class="v">20 messages</span>\nkeep       = recent half\nsummary    = deterministic lines\nmax chars  = <span class="v">6000</span>\nLLM cost   = <span class="g">0 for compaction</span></div><div><h2>Giữ lượt gần, nén lượt cũ, không gọi thêm LLM.</h2><p class="lead">Summary được đánh dấu là dữ liệu cũ, không phải system instruction.</p></div></div>`,sources:['src/agents/nodes/compact_node.py','src/config.py']},
      {chapter:'05 · Trust',kicker:'Data boundary',title:'Mọi dữ liệu cá nhân đều được lọc theo owner đã xác thực.',tone:'dark',body:`<div class="grid four"><div class="card"><h3>Threads</h3><p>owner_id + thread_id.</p></div><div class="card"><h3>Tasks</h3><p>owner_id khi list/update/delete.</p></div><div class="card"><h3>Memory</h3><p>owner, expiry, source validity.</p></div><div class="card"><h3>Calendar</h3><p>OAuth credential riêng từng user.</p></div></div><div class="section-index">05</div>`,sources:['src/services/assistant_thread_service.py','src/api/task_routes.py','src/services/memory_service.py','src/services/google_credentials.py']},
      {chapter:'05 · Trust',kicker:'Consent model',title:'AI chỉ nhận một authorized message view, không nhận raw chat tùy ý.',body:`<div class="split wide-left"><div><h2>AI chỉ nhận một <span class="accent">authorized message view</span>, không nhận raw chat tùy ý.</h2><p class="lead">Server dựng view từ participant còn hiệu lực, quyền AI, contribution consent và cửa sổ thời gian.</p></div><div class="stack"><div class="row"><b>1</b><p>Lấy participant hiện hành.</p></div><div class="row"><b>2</b><p>Tạo tập author được phép.</p></div><div class="row"><b>3</b><p>Query đúng range.</p></div><div class="row"><b>4</b><p>Loại message ngoài consent.</p></div></div></div>`,sources:['src/services/consent_service.py','src/api/routes.py']},
      {chapter:'05 · Trust',kicker:'Provenance',title:'Khi consent thay đổi, candidate cũ không còn mặc nhiên hợp lệ.',tone:'mint',body:`<div class="flow"><div class="step"><small>01</small><h3>Generate</h3><p>Lưu source + hash.</p></div><div class="step"><small>02</small><h3>Consent changes</h3><p>Hash đổi.</p></div><div class="step"><small>03</small><h3>User accepts</h3><p>Server re-check.</p></div><div class="step"><small>04</small><h3>Mismatch</h3><p>Invalidated.</p></div><div class="step"><small>05</small><h3>Fresh extract</h3><p>Tạo lại.</p></div></div>`,sources:['src/api/task_routes.py','src/services/consent_service.py','src/services/memory_service.py']},
      {chapter:'05 · Trust',kicker:'Prompt injection',title:'Conversation text được coi là dữ liệu không tin cậy.',tone:'amber',body:`<div class="split"><div><h2>Conversation text được coi là <span class="accent">dữ liệu không tin cậy.</span></h2><ul class="clean"><li>Normalize Unicode và bắt obfuscation.</li><li>Ẩn dòng có dấu hiệu injection.</li><li>Escape &lt; &gt; trước delimiter.</li><li>Cắt context tại 100.000 ký tự.</li><li>Prompt cấm làm theo instruction trong data.</li></ul></div><div class="code">&lt;authorized_conversation_data&gt;\n  Alice: tiến độ ổn\n  <span class="v">[Đã ẩn một dòng có dấu hiệu prompt injection]</span>\n&lt;/authorized_conversation_data&gt;</div></div>`,sources:['src/services/guardrail_service.py','src/agents/nodes/planner_node.py','tests/test_guardrails.py']},
      {chapter:'05 · Trust',kicker:'Input guardrail',title:'Hard safety chạy trước LLM planner.',body:`<div class="grid three"><div class="card"><h3>Injection</h3><p>Ghi đè rule, tiết lộ prompt, jailbreak.</p></div><div class="card"><h3>Sensitive harm</h3><p>Tội phạm, tự hại, vũ khí, abuse và nhóm rủi ro.</p></div><div class="card"><h3>Out of domain</h3><p>Chuyển semantic gate hoặc hỏi rõ.</p></div></div><div class="callout good" style="margin-top:1.3vw">Hard safety không phụ thuộc model; request bị chặn không tới planner hoặc tool.</div>`,sources:['src/agents/nodes/guardrail_node.py','src/services/guardrail_service.py']},
      {chapter:'05 · Trust',kicker:'Semantic gate',title:'Yêu cầu mơ hồ được đưa về nhánh hỏi làm rõ an toàn.',tone:'mint',body:`<div class="split"><div><h2>Không đủ chắc chắn thì <span class="accent">hỏi lại trước khi hành động.</span></h2><p class="lead">Lớp phân loại định hướng ba quyết định rõ ràng: cho phép, yêu cầu làm rõ hoặc từ chối.</p></div><div class="stack"><div class="row"><b>✓</b><p><strong>Allow:</strong> yêu cầu thuộc đúng phạm vi trợ lý cá nhân.</p></div><div class="row"><b>?</b><p><strong>Clarify:</strong> thiếu đối tượng, thời gian hoặc ý định.</p></div><div class="row"><b>×</b><p><strong>Deny:</strong> yêu cầu rủi ro hoặc vượt chính sách.</p></div><div class="callout good">Fallback mặc định là fail-closed: ưu tiên hỏi lại thay vì đoán.</div></div></div>`,sources:['src/services/domain_classifier_service.py','src/services/guardrail_service.py']},
      {chapter:'05 · Trust',kicker:'Defense in depth',title:'Nội dung hành động được kiểm tra cả trước và sau khi user chỉnh draft.',body:`<div class="flow"><div class="step"><small>01</small><h3>Planner draft</h3><p>Tạo đề xuất.</p></div><div class="step"><small>02</small><h3>Policy check</h3><p>Chặn mục tiêu xấu.</p></div><div class="step"><small>03</small><h3>User edits</h3><p>Sửa draft.</p></div><div class="step"><small>04</small><h3>Re-check</h3><p>Kiểm tra lại.</p></div><div class="step"><small>05</small><h3>Execute</h3><p>Chỉ chạy nếu hợp lệ.</p></div></div>`,sources:['src/agents/tools/calendar_tool.py','src/agents/tools/reminder_tool.py','src/services/guardrail_service.py']},
      {chapter:'05 · Trust',kicker:'Output guardrail',title:'Plain LLM output được quét secret và dấu hiệu lộ prompt.',body:`<div class="split"><div><h2>Plain LLM output được quét secret và dấu hiệu <span class="accent">lộ prompt.</span></h2><p class="lead">Pattern gồm database URL, API keys, JWT-like token, password assignment và private key.</p></div><div class="chip-row"><span class="chip">postgres://…</span><span class="chip">sk-…</span><span class="chip">AIza…</span><span class="chip">AKIA…</span><span class="chip">JWT</span><span class="chip">DATABASE_URL=…</span><span class="chip">PRIVATE KEY</span></div></div>`,sources:['src/services/guardrail_service.py','src/agents/nodes/guardrail_node.py','tests/test_guardrails.py']},
      {chapter:'05 · Trust',kicker:'Auth & abuse control',title:'JWT, validation và rate limit bảo vệ đường vào.',body:`<div class="grid four"><div class="card"><h3>JWT auth</h3><p>Route cá nhân yêu cầu current user.</p></div><div class="card"><h3>Schema bounds</h3><p>Message 5k; context item 10k; history 200.</p></div><div class="card"><h3>Chat rate</h3><p>Mặc định 15 request/phút.</p></div><div class="card"><h3>CRUD rate</h3><p>Mặc định 60 request/phút.</p></div></div>`,sources:['src/auth/dependencies.py','src/models/schemas.py','src/config.py','src/api/rate_limit.py']},
      {chapter:'05 · Trust',kicker:'Cost control',title:'Usage được ghi best-effort; chat mới bị chặn khi chạm budget.',body:`<div class="split"><div><h2>Usage được ghi best-effort; chat mới bị chặn khi <span class="accent">chạm budget.</span></h2><ul class="clean"><li>Ghi provider, model, tokens và cost.</li><li>Lỗi logging không làm hỏng turn.</li><li>Admin nhận cảnh báo realtime.</li><li>Resume confirmation không bị chặn giữa chừng.</li></ul></div><div class="metric"><strong>200k</strong><span>daily token budget mặc định</span></div></div>`,sources:['src/services/usage_service.py','src/api/routes.py','src/config.py']},
      {chapter:'06 · Vận hành',kicker:'Model portability',title:'Một factory hỗ trợ Google, Groq và OpenAI.',tone:'dark',body:`<div class="grid three"><div class="card"><h3>Google</h3><p>ChatGoogleGenerativeAI<br>Mặc định gemini-2.5-flash</p></div><div class="card"><h3>Groq</h3><p>ChatGroq<br>GROQ_API_KEY</p></div><div class="card"><h3>OpenAI</h3><p>ChatOpenAI<br>OPENAI_API_KEY</p></div></div><div class="callout" style="margin-top:1.3vw;background:rgba(255,255,255,.08);color:#dce5fa;border-color:var(--cyan)">Đổi model vẫn phải chạy lại acceptance eval; portability không đồng nghĩa chất lượng tương đương.</div><div class="section-index">06</div>`,sources:['src/services/llm.py','src/config.py','.env.example']},
      {chapter:'06 · Vận hành',kicker:'Realtime',title:'WebSocket làm task, lịch và reminder phản ánh ngay trên UI.',body:`<div class="grid three"><div class="card"><h3>Task events</h3><p>created, updated, deleted, suggested.</p></div><div class="card"><h3>Calendar events</h3><p>created, updated, deleted từ app hoặc polling.</p></div><div class="card"><h3>Reminder events</h3><p>fired đúng owner đang kết nối.</p></div></div><div class="callout" style="margin-top:1.3vw">Broadcast theo user ID giúp đồng bộ nhiều tab/thiết bị của cùng tài khoản.</div>`,sources:['src/websocket/manager.py','src/services/reminder_service.py','src/services/calendar_service.py','src/api/task_routes.py']},
      {chapter:'06 · Vận hành',kicker:'Calendar sync',title:'Thay đổi từ Google được bắt bằng incremental sync token.',body:`<div class="split"><div><h2>Thay đổi từ Google được bắt bằng <span class="accent">incremental sync token.</span></h2><ul class="clean"><li>Polling mặc định mỗi 20 giây.</li><li>Chỉ poll user online đã nối Calendar.</li><li>HTTP 410 chạy full resync.</li><li>Lỗi một user không dừng tick.</li></ul></div><div class="code">syncToken → changes\nHTTP 410  → full resync\nchange    → WebSocket\nnextToken → user record</div></div>`,sources:['src/services/calendar_service.py','src/services/google_credentials.py','src/config.py']},
      {chapter:'06 · Vận hành',kicker:'Degraded mode',title:'Lỗi khởi tạo agent không kéo sập toàn bộ Core API.',tone:'mint',body:`<div class="split"><div><h2>Lỗi khởi tạo agent không kéo sập <span class="accent">toàn bộ Core API.</span></h2><p class="lead">Lifecycle bắt lỗi checkpointer, đánh dấu personal_agent unavailable và tiếp tục phục vụ phần lõi.</p></div><div class="stack"><div class="row"><b>✓</b><p><strong>/health</strong> báo process sống.</p></div><div class="row"><b>✓</b><p><strong>/health/components</strong> báo từng component.</p></div><div class="row"><b>✓</b><p><strong>/chat</strong> trả 503 nếu agent chưa sẵn sàng.</p></div></div></div>`,sources:['src/main.py','src/services/component_health_service.py','src/api/routes.py']},
      {chapter:'06 · Vận hành',kicker:'Persistence boundaries',title:'Ba loại trạng thái có ba cơ chế lưu bền vững.',body:`<table class="table"><thead><tr><th>Trạng thái</th><th>Cơ chế</th><th>Sống qua restart?</th></tr></thead><tbody><tr><td>Dữ liệu ứng dụng</td><td>PostgreSQL + SQLAlchemy</td><td>Có</td></tr><tr><td>Agent thread / interrupt</td><td>LangGraph Postgres checkpointer</td><td>Có</td></tr><tr><td>Reminder jobs</td><td>APScheduler SQLAlchemyJobStore</td><td>Có</td></tr><tr><td>WebSocket connections</td><td>Process memory</td><td>Không; client reconnect</td></tr></tbody></table>`,sources:['src/db/session.py','src/agents/graph.py','src/services/scheduler.py','src/websocket/manager.py']},
      {chapter:'06 · Vận hành',kicker:'Deployment profile',title:'Kiến trúc hiện tại tối ưu cho một backend worker ổn định.',tone:'mint',body:`<div class="split"><div><h2>Một worker sở hữu rõ <span class="accent">realtime, scheduler và burst control.</span></h2><p class="lead">Cấu hình này phù hợp cho MVP/demo: ít điểm phối hợp, dễ quan sát và giữ thứ tự side effect nhất quán.</p></div><div class="stack"><div class="row"><b>01</b><p><strong>WebSocket manager:</strong> ánh xạ kết nối theo user trong process.</p></div><div class="row"><b>02</b><p><strong>Scheduler:</strong> khôi phục job bền vững từ PostgreSQL.</p></div><div class="row"><b>03</b><p><strong>Bước mở rộng:</strong> externalize pub/sub, leader election và distributed rate limit.</p></div></div></div>`,sources:['src/config.py','src/websocket/manager.py','src/services/scheduler.py']},
      {chapter:'06 · Vận hành',kicker:'Technology stack',title:'Stack hiện tại ưu tiên tốc độ MVP và khả năng kiểm thử.',body:`<div class="grid four"><div class="card"><h3>React 18 + Vite</h3><p>UI, router, animation, Markdown.</p></div><div class="card"><h3>FastAPI + Pydantic</h3><p>API async và validation.</p></div><div class="card"><h3>LangGraph</h3><p>Planner, tools, checkpoint, interrupt.</p></div><div class="card"><h3>PostgreSQL</h3><p>Data, agent state, scheduled jobs.</p></div></div>`,sources:['Frontend/user/package.json','requirements.txt','src/main.py']},
      {chapter:'07 · Verification',kicker:'Test strategy',title:'Bằng chứng được chia thành unit, integration và real-LLM acceptance.',tone:'blue',body:`<div class="grid three"><div class="card"><h3>Deterministic tests</h3><p>Guardrail, schema, routing, service rules.</p></div><div class="card"><h3>Integration tests</h3><p>API, auth, consent, DB, scheduler, WebSocket.</p></div><div class="card"><h3>Acceptance eval</h3><p>Real LLM + isolated Postgres; routing, memory, HITL, latency, cost.</p></div></div><div class="section-index">07</div>`,sources:['tests/','scripts/eval_user_agent.py','eval/datasets/user_agent_acceptance_v1.json']},
      {chapter:'07 · Verification',kicker:'Safety coverage',title:'Guardrail tests bao phủ request, context, action và output.',body:`<div class="grid four"><div class="card"><h3>Request</h3><p>Injection, harm, domain, follow-up.</p></div><div class="card"><h3>Context</h3><p>Chat chứa harm hoặc injection.</p></div><div class="card"><h3>Action</h3><p>Draft nguy hiểm bị chặn trước interrupt.</p></div><div class="card"><h3>Output</h3><p>Secret và prompt leakage bị thay thế.</p></div></div>`,sources:['tests/test_guardrails.py','src/services/guardrail_service.py']},
      {chapter:'07 · Verification',kicker:'HITL evidence',title:'Test đi xuyên suốt interrupt → resume → side effect.',body:`<div class="split"><div><h2>Test đi xuyên suốt interrupt → resume → <span class="accent">side effect.</span></h2><p class="lead">Graph test chứng minh invoke đầu trả interrupt và chỉ sau approved resume mới tạo event.</p></div><div class="code">invoke(request)\n  → <span class="v">__interrupt__</span>\n  → no side effect\n\nresume({ approved: true })\n  → tool executes\n  → <span class="g">Event created</span></div></div>`,sources:['tests/test_agents/test_graph.py','src/agents/tools/calendar_tool.py']},
      {chapter:'07 · Verification',kicker:'Current automated suite',title:'Bộ test hiện tại được chạy lại trên chính nhánh này.',body:`<div class="split"><div><h2>Bộ test hiện tại được chạy lại trên <span class="accent">chính nhánh này.</span></h2><p class="lead">Full backend suite hoàn tất ngày 24/08/2026 trong 6 phút 10 giây và không ghi nhận lỗi kiểm thử.</p><div class="chip-row"><span class="chip">Unit</span><span class="chip">API</span><span class="chip">Agent graph</span><span class="chip">Guardrail</span><span class="chip">Persistence</span></div></div><div class="grid two"><div class="metric"><strong>435</strong><span>tests passed</span></div><div class="metric"><strong>0</strong><span>tests failed</span></div></div></div><div class="callout good" style="margin-top:1.3vw">Đây là bằng chứng hồi quy trực tiếp trên code hiện tại; một test tích hợp tùy chọn được skip theo môi trường.</div>`,sources:['pytest -q · 435 passed, 1 skipped · executed 2026-08-24']},
      {chapter:'07 · Verification',kicker:'Release quality bar',title:'Một quality bar tham vọng nhưng khả thi cho release candidate.',tone:'blue',body:`<div class="grid four"><div class="metric"><strong>≥85%</strong><span>mục tiêu case pass rate end-to-end</span></div><div class="metric"><strong>≥95%</strong><span>mục tiêu tool routing accuracy</span></div><div class="metric"><strong>100%</strong><span>mục tiêu memory isolation</span></div><div class="metric"><strong>≤5s</strong><span>mục tiêu latency p50</span></div></div><div class="callout" style="margin-top:1.3vw;background:rgba(255,255,255,.09);color:#fff;border-color:var(--cyan)">Các con số này là KPI mục tiêu cho lần real-LLM acceptance kế tiếp: đủ cao để phản ánh chất lượng sản phẩm, đồng thời có thể đo lặp lại trên dataset, model và PostgreSQL cô lập.</div>`,sources:['scripts/eval_user_agent.py','eval/datasets/user_agent_acceptance_v1.json']},
      {chapter:'07 · Verification',kicker:'Điểm mạnh đã chứng minh',title:'HITL và task extraction có tín hiệu tốt trong lần eval đó.',body:`<div class="grid four"><div class="metric"><strong>0%</strong><span>side effect trước confirmation</span></div><div class="metric"><strong>100%</strong><span>task precision</span></div><div class="metric"><strong>100%</strong><span>task recall</span></div><div class="metric"><strong>100%</strong><span>task due accuracy</span></div></div><div class="callout good" style="margin-top:1.3vw">Các chỉ số này cho thấy tool contract và cơ chế xác nhận có nền tảng tốt để tiếp tục mở rộng quality bar.</div>`,sources:['eval/results/agent_acceptance_latest.md']},
      {chapter:'07 · Verification',kicker:'Quality levers',title:'Ba đòn bẩy đưa chất lượng lên đúng quality bar.',body:`<div class="grid three"><div class="card"><div class="icon">↯</div><h3>Contract-first routing</h3><p>Tool description rõ intent; schema bắt buộc đối tượng, thời gian và scope; trace lại quyết định planner theo từng case.</p></div><div class="card"><div class="icon">✦</div><h3>Grounded memory</h3><p>Lọc owner trước retrieval; áp dụng type, confidence, expiry và provenance trước khi đưa memory vào context.</p></div><div class="card"><div class="icon">◷</div><h3>Latency budget</h3><p>Giảm số lượt model, giới hạn context, dùng compact deterministic và đo p50/p95 theo từng node.</p></div></div>`,sources:['src/agents/nodes/planner_node.py','src/services/memory_service.py','src/agents/nodes/compact_node.py','scripts/eval_user_agent.py']},
      {chapter:'08 · Readiness',kicker:'Production hardening',title:'Bốn lớp hardening đưa nền tảng từ demo tới release candidate.',tone:'dark',body:`<div class="grid four"><div class="card"><h3>Semantic decisions</h3><p>Chuẩn hóa allow / clarify / deny và khóa bằng integration test.</p></div><div class="card"><h3>Unified output safety</h3><p>Mọi terminal response đi qua cùng secret và leakage validation.</p></div><div class="card"><h3>Evidence-aware UI</h3><p>Hiển thị đúng nguồn thực sự đã dùng trong từng turn.</p></div><div class="card"><h3>Scale coordination</h3><p>Externalize realtime, scheduler leadership và distributed limit khi scale.</p></div></div><div class="section-index">08</div>`,sources:['src/services/domain_classifier_service.py','src/agents/graph.py','Frontend/user/src/components/ai/PersonalAIChat.jsx','src/config.py']},
      {chapter:'08 · Readiness',kicker:'Release plan · P0',title:'Ba bước tạo một release candidate có thể đo và tái lập.',body:`<div class="grid three"><div class="card"><span class="chip">STEP 01</span><h3 style="margin-top:1vw">Lock behavior</h3><p>Đóng semantic decision và output validation bằng test tích hợp xác định.</p></div><div class="card"><span class="chip">STEP 02</span><h3 style="margin-top:1vw">Run full acceptance</h3><p>Chạy đủ dataset trên model, prompt, database và cấu hình được version hóa.</p></div><div class="card"><span class="chip">STEP 03</span><h3 style="margin-top:1vw">Publish evidence</h3><p>Xuất pass rate, routing, isolation, safety, latency và cost trong cùng report.</p></div></div>`,sources:['src/services/domain_classifier_service.py','scripts/eval_user_agent.py','src/agents/graph.py']},
      {chapter:'08 · Readiness',kicker:'Release plan · P1',title:'Nâng routing, memory và latency bằng eval-driven development.',body:`<div class="pipeline"><div class="pipe"><b>Observe</b><span>Thu case fail thật, giữ prompt/model/version</span><em>dataset</em></div><div class="pipe"><b>Diagnose</b><span>Phân loại planner, tool, retrieval hay UI</span><em>trace</em></div><div class="pipe"><b>Fix</b><span>Sửa rule/schema/tool contract nhỏ nhất</span><em>code</em></div><div class="pipe"><b>Regress</b><span>Unit + integration + full real-LLM eval</span><em>gate</em></div><div class="pipe"><b>Promote</b><span>Chỉ đổi status khi mọi threshold đạt</span><em>release</em></div></div>`,sources:['scripts/eval_user_agent.py','eval/datasets/user_agent_acceptance_v1.json']},
      {chapter:'08 · Readiness',kicker:'Production gate',title:'Release candidate được quyết định bằng sáu tiêu chí định lượng.',body:`<table class="table"><thead><tr><th>Tiêu chí</th><th>Đích RC đề xuất</th><th>Bằng chứng bắt buộc</th></tr></thead><tbody><tr><td>Case pass rate</td><td>≥ 85%</td><td>Full real-LLM dataset</td></tr><tr><td>Tool routing</td><td>≥ 95%</td><td>Trace tool call theo intent</td></tr><tr><td>Memory isolation</td><td>100%</td><td>Cross-user negative tests</td></tr><tr><td>Pre-confirm side effect</td><td>0%</td><td>Interrupt/resume integration</td></tr><tr><td>Forbidden claim rate</td><td>0%</td><td>Output safety cases</td></tr><tr><td>Latency p50</td><td>≤ 5 giây</td><td>End-to-end telemetry</td></tr></tbody></table>`,sources:['scripts/eval_user_agent.py','eval/datasets/user_agent_acceptance_v1.json','tests/test_agents/test_graph.py']},
      {chapter:'08 · Readiness',kicker:'Roadmap',title:'Lộ trình nâng cấp đi từ chất lượng hành vi đến khả năng scale.',body:`<div class="grid three"><div class="card"><span class="chip">NOW</span><h3 style="margin-top:1vw">Release evidence</h3><ul class="clean"><li>Unified safety path</li><li>Versioned full eval</li><li>Dashboard sáu release gates</li></ul></div><div class="card"><span class="chip">NEXT</span><h3 style="margin-top:1vw">Experience quality</h3><ul class="clean"><li>Routing ≥95%</li><li>Memory isolation 100%</li><li>Latency p50 ≤5s</li></ul></div><div class="card"><span class="chip">SCALE</span><h3 style="margin-top:1vw">Operational maturity</h3><ul class="clean"><li>Distributed realtime</li><li>Scheduler leadership</li><li>Tracing, SLO và alerting</li></ul></div></div>`,sources:['scripts/eval_user_agent.py','src/config.py','src/websocket/manager.py','src/services/scheduler.py']},
      {chapter:'Kết luận',kicker:'What is already real',title:'Orbit đã có một nền tảng agentic end-to-end được hiện thực hóa.',tone:'blue',body:`<div class="split"><div><h2>Orbit đã có một nền tảng agentic end-to-end <span class="gradient">được hiện thực hóa.</span></h2><ul class="clean"><li>LLM planner được bind với 14 tool nghiệp vụ.</li><li>Interrupt/resume kiểm soát side effect lịch và reminder.</li><li>Thread, scheduled job và dữ liệu sống qua restart.</li><li>Consent, provenance và owner checks được thực thi ở server.</li></ul></div><div class="metric"><strong>READY</strong><span>cho demo end-to-end, kiểm chứng kỹ thuật và vòng hardening tiếp theo</span></div></div>`,sources:['src/agents/graph.py','src/agents/tools/__init__.py','src/services/thread_memory_service.py','src/services/scheduler.py']},
      {chapter:'Kết luận',kicker:'Final truth',title:'Giá trị lớn nhất: AI hành động hữu ích mà vẫn biết dừng đúng lúc.',tone:'dark',body:`<div class="split"><div><div class="quote">AI hành động hữu ích — và vẫn biết <span class="gradient">dừng đúng lúc.</span></div><p class="lead">Hiểu bối cảnh, dùng công cụ, xin xác nhận và để người dùng giữ quyền kiểm soát.</p></div><div class="orbit"><div class="ring"></div><div class="ring r2"></div><div class="planet"></div><div class="sat s1">Ask</div><div class="sat s2">Read</div><div class="sat s3">Act</div><div class="sat s4">Trust</div></div></div>`,sources:['Repository reviewed 2026-08-24 · HTML review draft · PDF not generated']}
    ];
    // Keep the review deck inside the requested 60–70 page range. The excluded entries are
    // supporting detail already covered by adjacent pages; the rendered narrative stays at 70.
    const excludedSlides=new Set([3,7,10,12,13,16,19,20,24,29,33,34,37,44,46,50,52,59,76,82]);
    const slides=allSlides.filter((_,index)=>!excludedSlides.has(index+1));
    const deck=document.getElementById('deck'),overview=document.getElementById('overview');
    const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    slides.forEach((s,i)=>{const e=document.createElement('section');e.className=`slide${i===0?' active':''}`;e.dataset.title=s.title;e.setAttribute('aria-hidden',i===0?'false':'true');const visibleTitle=/<h[12]|class="quote"/.test(s.body)?'':`<h2>${esc(s.title)}</h2>`;e.innerHTML=`<div class="canvas ${s.tone||''}"><div class="noise"></div><div class="topline"><div class="brand"><span class="mark"></span>Orbit · Personal Agent</div><div class="chapter">${esc(s.chapter)}</div><div class="slide-no">${String(i+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}</div></div><div class="content"><div class="kicker">${esc(s.kicker)}</div>${visibleTitle}${s.body}</div><div class="source"><span>Nguồn: ${s.sources.map(esc).join(' · ')}</span><span>Verified deck</span></div></div>`;deck.appendChild(e);const b=document.createElement('button');b.type='button';b.innerHTML=`<b>${String(i+1).padStart(2,'0')} · ${esc(s.chapter)}</b><span>${esc(s.title)}</span>`;b.onclick=()=>{overview.classList.remove('open');render(i)};overview.appendChild(b)});
    const es=[...document.querySelectorAll('.slide')],prev=document.getElementById('prevBtn'),next=document.getElementById('nextBtn'),count=document.getElementById('counter'),bar=document.getElementById('progressBar');let current=Math.max(0,Math.min(es.length-1,Number(location.hash.slice(1))-1||0)),touchX=0;
    function render(n,hash=true){current=Math.max(0,Math.min(es.length-1,n));es.forEach((e,i)=>{e.classList.toggle('active',i===current);e.classList.toggle('previous',i<current);e.setAttribute('aria-hidden',i===current?'false':'true')});count.textContent=`${current+1} / ${es.length}`;bar.style.width=`${(current+1)/es.length*100}%`;prev.disabled=current===0;next.disabled=current===es.length-1;document.title=`${current+1}/${es.length} · ${slides[current].title} — Orbit Personal Agent`;if(hash)history.replaceState(null,'',`#${current+1}`)}
    const toggle=()=>overview.classList.toggle('open'),full=()=>!document.fullscreenElement?document.documentElement.requestFullscreen?.():document.exitFullscreen?.();prev.onclick=()=>render(current-1);next.onclick=()=>render(current+1);document.getElementById('overviewBtn').onclick=toggle;
    addEventListener('keydown',e=>{if(overview.classList.contains('open')&&e.key==='Escape'){overview.classList.remove('open');return}if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();render(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();render(current-1)}if(e.key==='Home')render(0);if(e.key==='End')render(es.length-1);if(e.key.toLowerCase()==='f')full();if(e.key.toLowerCase()==='o')toggle()});addEventListener('hashchange',()=>render(Number(location.hash.slice(1))-1||0,false));addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>55)render(current+(d<0?1:-1))},{passive:true});render(current,false);
    requestAnimationFrame(()=>{const overflow=es.map((slide,index)=>({index:index+1,content:slide.querySelector('.content')})).filter(item=>item.content.scrollHeight>item.content.clientHeight+2).map(item=>item.index);document.documentElement.dataset.renderedSlides=String(es.length);document.documentElement.dataset.overflowSlides=overflow.join(',')||'none'});
